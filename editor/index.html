<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客编辑器</title>
  <link rel="stylesheet" href="/__editor/vendor/vditor/dist/index.css">
  <link rel="stylesheet" href="/__editor/figure.css">
  <link rel="stylesheet" href="/__editor/style.css">
  <script src="/__editor/vendor/vditor/dist/index.min.js" defer></script>
  <script type="module" src="/__editor/app.js"></script>
</head>
<body>
  <header class="toolbar">
    <strong class="brand">Yuchi 的博客 · 编辑器</strong>
    <div class="tools">
      <button id="new" type="button">新建</button>
      <button id="open" type="button">打开</button>
      <label>栏目 <select id="section"><option value="essay">随笔</option><option value="tech">技术</option></select></label>
      <label>日期 <input id="date" type="date"></label>
    </div>
    <div class="tools">
      <button id="cover" type="button">封面</button>
      <button id="adjust-cover" type="button" disabled>调整裁切</button>
      <button id="remove-cover" type="button" hidden>移除封面</button>
      <button id="image" type="button">图片</button>
      <button id="link" type="button">链接</button>
      <button id="attachment" type="button">附件</button>
      <button id="source" type="button">Markdown 源码</button>
      <button id="toggle-preview" type="button">博客预览</button>
    </div>
    <div class="tools">
      <button id="save-draft" type="button">保存草稿</button>
      <button id="save" type="button" class="primary">保存到博客</button>
      <button id="push-update" type="button" disabled>推送更新</button>
    </div>
    <p id="status" role="status" class="status">正在加载编辑器…</p>
  </header>

  <main id="canvas" class="canvas">
    <section id="compose" class="compose">
      <figure id="cover-block" class="article-cover" hidden>
        <img id="cover-preview" alt="文章封面">
      </figure>
      <input id="title" class="article-title" aria-label="文章标题" placeholder="请输入标题" autocomplete="off">
      <div class="figure-stage">
        <div id="rich-editor"></div>
        <div id="figure-controls" hidden>
          <div class="figure-toolbar">
            <label>对齐 <select id="figure-align">
              <option value="left">左</option><option value="center">中</option><option value="right">右</option><option value="free">自由</option>
            </select></label>
            <label><input id="figure-center" type="checkbox"> 自动居中</label>
            <label>宽度 <input id="figure-width" type="number" min="5" max="100" step="1" aria-label="图片宽度百分比"> %</label>
          </div>
          <button id="figure-resize-width" class="figure-handle" data-resize="width" type="button" aria-label="拖动调整图片宽度" title="拖动调整图片宽度"></button>
          <button id="figure-resize-height" class="figure-handle" data-resize="height" type="button" aria-label="拖动调整图片高度" title="拖动调整图片高度"></button>
          <button id="figure-resize" class="figure-handle" data-resize="both" type="button" aria-label="拖动按比例缩放" title="拖动按比例缩放"></button>
          <input id="figure-caption" aria-label="图片说明" placeholder="添加图片说明">
        </div>
      </div>
      <textarea id="markdown" aria-label="Markdown 源码" placeholder="请输入正文" spellcheck="false" hidden></textarea>
    </section>
    <iframe id="preview" title="博客文章预览" hidden></iframe>
  </main>

  <input id="file" type="file" hidden>

  <dialog id="cover-dialog" aria-labelledby="cover-dialog-title">
    <h2 id="cover-dialog-title">调整裁切</h2>
    <form id="cover-form" method="dialog">
      <div class="cover-ratio">
        <label>比例宽 <input id="cover-width" type="number" min="1" step="any" required value="4"></label>
        <span aria-hidden="true">∶</span>
        <label>比例高 <input id="cover-height" type="number" min="1" step="any" required value="1"></label>
        <button id="reset-cover" type="button">恢复默认</button>
      </div>
      <figure class="article-cover cover-crop">
        <img id="cover-crop-image" alt="封面裁切预览" draggable="false">
      </figure>
      <label>上下位置 <input id="cover-position" type="range" min="0" max="100" value="50"></label>
      <div class="dialog-actions">
        <button type="button" data-close>取消</button>
        <button id="confirm-cover" type="submit" class="primary">确认</button>
      </div>
    </form>
  </dialog>

  <dialog id="push-dialog" aria-labelledby="push-title">
    <h2 id="push-title">确认推送更新</h2>
    <p id="push-files"></p>
    <div class="push-diff" tabindex="0" aria-label="文章全文修改对比">
      <table>
        <thead><tr><th scope="col">修改前</th><th scope="col">修改后</th></tr></thead>
        <tbody id="push-diff"></tbody>
      </table>
    </div>
    <p id="push-status" class="status" role="status"></p>
    <div class="dialog-actions">
      <button id="cancel-push" type="button" data-close autofocus>取消</button>
      <button id="confirm-push" type="button" class="primary">确认推送</button>
    </div>
  </dialog>

  <dialog id="open-dialog">
    <form id="open-form" method="dialog">
      <h2>打开文章或草稿</h2>
      <label>选择文件 <select id="open-choice" required></select></label>
      <div class="dialog-actions">
        <button type="button" data-close>取消</button>
        <button type="submit" class="primary">打开</button>
      </div>
    </form>
  </dialog>

  <dialog id="link-dialog">
    <form id="link-form" method="dialog">
      <h2>插入链接</h2>
      <label>显示文字 <input id="link-text"></label>
      <label>网址 <input id="link-url" required placeholder="https://"></label>
      <div class="dialog-actions">
        <button type="button" data-close>取消</button>
        <button type="submit" class="primary">插入</button>
      </div>
    </form>
  </dialog>
</body>
</html>
